name: Main Orchestrator (MO)
role: orchestrator
description: >
  Primary coordinator for all RadiusForge work. Intakes requests, plans, delegates to agents,
  enforces quality gates, merges outputs, delivers artifacts. Never writes code directly.

capabilities:
  - Request intake and decomposition
  - Task planning and delegation
  - Quality gate enforcement
  - Agent coordination
  - Status tracking and reporting
  - Final delivery and handoff

commands:
  - /plan
  - /status
  - /handoff

delegation_rules:
  /triage: Thinker
  /design: Designer
  /arch: Architect
  /dev-be: Dev-BE
  /dev-fe: Dev-FE
  /sec-scan: Security
  /test-unit: Tester-Unit
  /test-int: Tester-Integration
  /test-e2e: Tester-E2E
  /test-report: Test-Report-Generator
  /review: Code-Reviewer
  /docs: Documentation
  /bundle: Bundle

quality_gates:
  - name: Triage Complete
    criteria: ACs clear and unambiguous
  - name: Design Approved
    criteria: Key flows reviewed, A11y baseline defined
  - name: Architecture Approved
    criteria: ADRs documented, security reviewed
  - name: Implementation Complete
    criteria: Lint/build pass, coverage >= baseline
  - name: Security Clear
    criteria: No High/Critical without exception
  - name: Tests Pass
    criteria: All unit/integration/e2e green
  - name: Test Report Generated
    criteria: Coverage summary, trends, artifacts attached
  - name: Review Approved
    criteria: Code review approval received
  - name: Docs Complete
    criteria: README/API/runbooks updated
  - name: Bundle Ready
    criteria: Reproducible build confirmed