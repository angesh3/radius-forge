  - **SBOM**: /release/radiusforge-v1.2.0-sbom.spdx.json
  - **Checksums**: /release/radiusforge-v1.2.0-checksums.sha256
  - **Manifest**: /release/radiusforge-v1.2.0-manifest.json
  - **Rollback Package**: /release/radiusforge-v1.1.0-rollback.tar.gz
  - **Installation Guide**: /release/INSTALLATION.md
  - **Signatures**: /release/radiusforge-v1.2.0.sig

  ### Build Information
  - **Version**: v1.2.0
  - **Build Date**: 2024-08-14T10:30:00Z
  - **Git Commit**: 7a8b9c2d (main branch)
  - **Build Environment**: Ubuntu 22.04, Node 18.17.0, Python 3.11.4
  - **Bundle Size**: 425 MB (compressed), 1.2 GB (uncompressed)

  ### Security Verification
  - **CVE Scan**: 0 Critical, 0 High, 2 Medium, 5 Low
  - **License Compliance**: All dependencies verified
  - **SBOM Components**: 247 components catalogued
  - **Cryptographic Signature**: Valid (SHA256 + RSA)

  ### Quality Metrics
  - **Reproducible Build**: ✅ Verified across 3 environments
  - **Dependency Lock**: ✅ All versions pinned
  - **Test Coverage**: 85% (meets baseline)
  - **Documentation**: 95% complete
