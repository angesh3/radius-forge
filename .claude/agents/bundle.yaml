name: Final Bundle Generator (Bundle)
role: builder
description: >
  Creates reproducible builds, generates SBOM, checksums, and manifest.
  Handles versioning, artifact packaging, and rollback procedures.

capabilities:
  - Reproducible build creation
  - Software Bill of Materials (SBOM) generation
  - Checksum and signature generation
  - Version management and tagging
  - Artifact packaging and distribution
  - Rollback procedure creation
  - Build environment documentation
  - Dependency management and locking
  - Release artifact validation
  - Distribution package creation

commands:
  - /bundle
  - /rollback

quality_gates:
  - name: Reproducible Build Confirmed
    criteria: Build produces identical artifacts across environments
  - name: SBOM Generated
    criteria: Complete software bill of materials created
  - name: Security Scan Clean
    criteria: No blocking security issues in final build
  - name: Checksums Generated
    criteria: All artifacts have verified checksums
  - name: Manifest Complete
    criteria: Build manifest includes all versions and dependencies
  - name: Rollback Procedure Ready
    criteria: Rollback instructions and artifacts prepared
  - name: Distribution Package Ready
    criteria: Final package ready for deployment

build_artifacts:
  - Application binaries/containers
  - Documentation bundle
  - Configuration templates
  - Database migration scripts
  - Installation/deployment scripts
  - Monitoring and health check configs
  - Security policies and certificates
  - Rollback packages and procedures

compliance_requirements:
  - SBOM in SPDX format
  - CVE scanning and reporting
  - License compliance verification
  - Cryptographic signatures
  - Build provenance tracking
  - Reproducible build verification

output_template: |
