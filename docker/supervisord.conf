[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/opt/radiusforge/logs/nginx.log
stderr_logfile=/opt/radiusforge/logs/nginx.error.log

[program:api-server]
command=python -m uvicorn src.api.main_simple:app --host 0.0.0.0 --port 8910
directory=/opt/radiusforge
autostart=true
autorestart=true
stdout_logfile=/opt/radiusforge/logs/api.log
stderr_logfile=/opt/radiusforge/logs/api.error.log
environment=PYTHONPATH="/opt/radiusforge"

[program:health-check]
command=python /opt/radiusforge/docker/health_server.py
directory=/opt/radiusforge
autostart=true
autorestart=true
stdout_logfile=/opt/radiusforge/logs/health.log
stderr_logfile=/opt/radiusforge/logs/health.error.log

[program:metrics]
command=python /opt/radiusforge/docker/metrics_server.py
directory=/opt/radiusforge
autostart=true
autorestart=true
stdout_logfile=/opt/radiusforge/logs/metrics.log
stderr_logfile=/opt/radiusforge/logs/metrics.error.log

[program:websocket]
command=python -c "import http.server; import socketserver; httpd = socketserver.TCPServer(('', 8912), http.server.SimpleHTTPRequestHandler); httpd.serve_forever()"
directory=/opt/radiusforge
autostart=true
autorestart=true
stdout_logfile=/opt/radiusforge/logs/websocket.log
stderr_logfile=/opt/radiusforge/logs/websocket.error.log

[program:backup]
