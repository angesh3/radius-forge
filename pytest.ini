[tool:pytest]
# Test discovery and execution configuration
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output and verbosity
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-branch
    --durations=10

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (database, API, services)
    e2e: End-to-end tests (full workflow, WebSocket, UI)
    slow: Tests that take longer than 1 second
    network: Tests requiring network access
    radius: Tests involving RADIUS protocol
    websocket: Tests involving WebSocket connections
    api: Tests for REST API endpoints
    database: Tests requiring database access

# Test execution
minversion = 6.0
asyncio_mode = auto

# Timeout settings
timeout = 300
timeout_method = thread

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*pytest-asyncio.*:pytest.PytestConfigWarning

# Coverage configuration
[coverage:run]
source = src
omit = 
    */tests/*
    */venv/*
    */env/*
    */__pycache__/*
    */migrations/*
    */.pytest_cache/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod