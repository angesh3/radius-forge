name: RadiusForge CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  POSTGRES_VERSION: '15'

jobs:
  # =============================================================================
  # Unit Tests
  # =============================================================================
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio
    
    - name: Run Python unit tests
      run: |
        make test-unit
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json
    
    - name: Install Node dependencies
      run: |
        cd ui
        npm ci
    
    - name: Run React unit tests
      run: |
        cd ui
        npm test -- --watchAll=false --coverage
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-unit
        path: |
          htmlcov/
          ui/coverage/

  # =============================================================================
  # Integration Tests
  # =============================================================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
    
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: radiusforge
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: radiusforge_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx
    
    - name: Run database migrations
      env:
        DATABASE_URL: postgresql://radiusforge:testpass@localhost:5432/radiusforge_test
      run: |
        cd src
        alembic upgrade head
    
    - name: Run integration tests
      env:
        DATABASE_URL: postgresql://radiusforge:testpass@localhost:5432/radiusforge_test
      run: |
        make test-int
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: test-results/

  # =============================================================================
  # End-to-End Tests
  # =============================================================================
  test-e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: test-integration
    
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: radiusforge
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: radiusforge_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json
    
    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install frontend dependencies
      run: |
        cd ui
        npm ci
        npx playwright install chromium
    
    - name: Build frontend
      run: |
        cd ui
        npm run build
    
    - name: Start backend server
      env:
        DATABASE_URL: postgresql://radiusforge:testpass@localhost:5432/radiusforge_test
        API_PORT: 8910
      run: |
        cd src
        uvicorn api.main:app --host 0.0.0.0 --port 8910 &
        sleep 5
    
    - name: Run E2E tests
      run: |
        make test-e2e
    
    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-results
        path: |
          ui/test-results/
          ui/playwright-report/

  # =============================================================================
  # Test Report Generation
  # =============================================================================
  test-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-e2e]
    if: always()
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install report dependencies
      run: |
        pip install jinja2 reportlab weasyprint
    
    - name: Download all test artifacts
      uses: actions/download-artifact@v3
      with:
        path: test-artifacts/
    
    - name: Generate unified test report
      run: |
        make test-report
    
    - name: Upload test report
      uses: actions/upload-artifact@v3
      with:
        name: test-report
        path: |
          release/test-report-*.html
          release/test-report-*.pdf
    
    - name: Comment PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const reportPath = 'release/test-report-summary.json';
          if (fs.existsSync(reportPath)) {
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const comment = `## 📊 Test Report
            
            - **Unit Tests**: ${report.unit.passed}/${report.unit.total} passed
            - **Integration Tests**: ${report.integration.passed}/${report.integration.total} passed
            - **E2E Tests**: ${report.e2e.passed}/${report.e2e.total} passed
            - **Coverage**: ${report.coverage}%
            
            [View Full Report](${context.payload.pull_request.html_url}/checks)`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

  # =============================================================================
  # Code Review (Linting & Static Analysis)
  # =============================================================================
  review:
    name: Code Review
    runs-on: ubuntu-latest
    needs: test-report
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Install review tools
      run: |
        pip install flake8 black mypy bandit safety
        cd ui && npm ci
    
    - name: Run Python linting
      run: |
        flake8 src/ --max-line-length=100 --exclude=__pycache__
        black src/ --check
        mypy src/ --ignore-missing-imports
    
    - name: Run security scan
      run: |
        bandit -r src/
        safety check
    
    - name: Run JavaScript linting
      run: |
        cd ui
        npm run lint
    
    - name: Upload review results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: review-results
        path: review-results/

  # =============================================================================
  # Build & Bundle
  # =============================================================================
  build:
    name: Build & Bundle
    runs-on: ubuntu-latest
    needs: review
    if: success()
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        cd ui && npm ci
    
    - name: Build frontend
      run: |
        cd ui
        npm run build
    
    - name: Build backend
      run: |
        python setup.py sdist bdist_wheel
    
    - name: Create deployment bundle
      run: |
        make bundle
    
    - name: Generate SBOM
      run: |
        pip install cyclonedx-bom
        cyclonedx-py -r requirements.txt -o release/sbom-python.json
        cd ui && npx @cyclonedx/cyclonedx-npm --output ../release/sbom-npm.json
    
    - name: Calculate checksums
      run: |
        cd release
        sha256sum *.tar.gz *.json > checksums.sha256
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: |
          release/*.tar.gz
          release/sbom-*.json
          release/checksums.sha256
          dist/

  # =============================================================================
  # Quality Gates Check
  # =============================================================================
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [test-report, review, build]
    if: always()
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Download test report
      uses: actions/download-artifact@v3
      with:
        name: test-report
        path: test-report/
    
    - name: Check quality gates
      run: |
        python .claude/check_quality_gates.py
    
    - name: Final status
      run: |
        echo "✅ All quality gates passed!"
        echo "Ready for deployment"

  # =============================================================================
  # Deploy (only on main branch)
  # =============================================================================
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: quality-gates
    if: github.ref == 'refs/heads/main' && success()
    environment: staging
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-artifacts
        path: release/
    
    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        # Add actual deployment commands here
    
    - name: Run smoke tests
      run: |
        echo "🔥 Running smoke tests..."
        # Add smoke test commands here
    
    - name: Notify deployment
      run: |
        echo "📧 Sending deployment notification..."
        # Add notification commands here