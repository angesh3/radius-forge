global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'radiusforge-api'
    static_configs:
      - targets: ['radiusforge-api-prod:8916']
    scrape_interval: 5s
    metrics_path: /metrics

  - job_name: 'radiusforge-health'
    static_configs:
      - targets: ['radiusforge-api-prod:8917']
    scrape_interval: 30s
    metrics_path: /health
